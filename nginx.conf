server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing fix
    location / {
        try_files $uri $uri/ /index.html;
    }
 
    location /login-required {
        return 302 /apps/login;
    } 
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    } 
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}